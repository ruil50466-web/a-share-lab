<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>A股随身行情</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121d2e;--line:#26354a;--muted:#9aabc2;--text:#eef4ff;--accent:#73b7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Noto Sans SC",sans-serif}
main{max-width:720px;margin:auto;padding:20px 16px 36px}
h1{font-size:24px;margin:4px 0}p{margin:6px 0;color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;background:#0b1422;color:var(--text);font-size:18px}
button{border:0;border-radius:10px;padding:12px 14px;font-weight:650;font-size:15px;background:var(--accent);color:#07111f;cursor:pointer}.secondary{background:#24354b;color:var(--text)}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.key{color:var(--muted)}.value{font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}
.price{font-size:32px;font-weight:750;letter-spacing:-.5px}.up{color:#ff6b75}.down{color:#4bd6a0}.status{font-size:13px;overflow-wrap:anywhere}.small{font-size:12px}.hidden{display:none}.warning{color:#ffcc80}
</style>
</head>
<body><main>
<h1>📈 A股随身行情</h1>
<p>手机查个股快照，整理成可直接交给 ChatGPT 分析的数据。</p>
<div class="panel">
<label for="code">股票代码（6位）</label>
<input id="code" inputmode="numeric" maxlength="6" placeholder="例如 600519" value="600519">
<div class="actions"><button id="query">查询行情</button><button class="secondary" id="copy" disabled>复制分析材料</button></div>
<p id="status" class="status">数据来源：A股数据 API。免费匿名行情可能延迟，页面会显示实际返回时间（如有）。</p>
</div>
<div class="panel hidden" id="result">
<div id="name" class="small"></div>
<div class="price" id="price">—</div>
<div id="change"></div>
<div id="fields"></div>
</div>
<div class="panel">
<strong>怎么用</strong>
<p>1. 输入股票代码并查询。</p>
<p>2. 点击“复制分析材料”。</p>
<p>3. 回到 ChatGPT 粘贴，要求分析量价、位置、风险和失效条件。</p>
<p class="small warning">行情查询页面不等于交易终端；免费接口可能延迟、限流或暂时不可用。交易决策前请与券商/行情软件核对。</p>
</div>
</main>
<script>
const $=id=>document.getElementById(id);let latest=null;
function first(o,keys){for(const k of keys){if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=="")return o[k]}return null}
function fmt(v){if(v===null||v===undefined||v==="")return "暂无";if(typeof v==="number")return v.toLocaleString("zh-CN",{maximumFractionDigits:4});return String(v)}
function toCode(v){v=v.trim();if(!/^\d{6}$/.test(v))throw Error("请输入6位股票代码");return (v.startsWith("6")?"sh":"sz")+v}
function render(data, envelope){
 const d=Array.isArray(data)?data[0]:data;
 if(!d||typeof d!=="object")throw Error("接口没有返回可识别的行情数据");
 latest=d;
 const name=first(d,["name","名称","stock_name","股票名称","股票简称","symbol"])||$("code").value;
 const price=first(d,["last","price","最新价","现价","最新价格","close"]);
 const change=first(d,["change_percent","涨跌幅","涨跌幅(%)","pct_chg","涨幅"]);
 $("name").textContent=name+" · "+$("code").value;
 $("price").textContent=price===null?"未返回现价":fmt(price);
 const pct=Number(change);$("change").textContent=change===null?"涨跌幅：暂无":("涨跌幅："+fmt(change)+(String(change).includes("%")?"":"%"));
 $("change").className=Number.isFinite(pct)?(pct>0?"up":pct<0?"down":""):"";
 const fields=[["开盘",["open","开盘","今开"]],["最高",["high","最高","最高价"]],["最低",["low","最低","最低价"]],["成交量",["volume","成交量","vol"]],["成交额",["amount","成交额","turnover_amount"]],["换手率",["turnover","换手率"]],["更新时间",["timestamp","更新时间","update_time","time"]]];
 $("fields").innerHTML=fields.map(([label,keys])=>'<div class="row"><span class="key">'+label+'</span><span class="value">'+fmt(first(d,keys))+'</span></div>').join("");
 $("result").classList.remove("hidden");$("copy").disabled=false;
 const source=first(envelope,["source","来源"])||"接口未注明";
 $("status").textContent="查询成功 · 来源："+source+" · 请注意免费数据可能延迟";
}
$("query").addEventListener("click",async()=>{
 $("status").textContent="正在查询…";$("query").disabled=true;$("copy").disabled=true;
 try{
 const code=toCode($("code").value);
 const response=await fetch("https://api.ashareapi.com/v1/quote?code="+encodeURIComponent(code),{headers:{Accept:"application/json"}});
 if(!response.ok)throw Error("行情接口返回 HTTP "+response.status);
 const json=await response.json();
 if(json.ok===false)throw Error(json.message||json.error||"数据源暂时没有返回行情");
 render(json.data,json);
 }catch(e){$("status").textContent="查询失败："+e.message+"。可能是网络、跨域限制、接口限流或数据源暂不可用。";$("status").classList.add("warning")}
 finally{$("query").disabled=false}
});
$("copy").addEventListener("click",async()=>{
 if(!latest)return;
 const prompt="请基于以下行情数据分析这只A股。先区分事实与推断，再分析量价、结构位置、板块/主线验证、风险和明确的失效条件；数据不足就指出缺口，不要编造。\n股票代码："+$("code").value+"\n行情数据：\n"+JSON.stringify(latest,null,2)+"\n注意核对行情时间和延迟。";
 try{await navigator.clipboard.writeText(prompt);$("status").textContent="分析材料已复制。回到 ChatGPT 粘贴即可。"}
 catch(e){const ta=document.createElement("textarea");ta.value=prompt;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();$("status").textContent="分析材料已尝试复制；若失败，请检查浏览器剪贴板权限。"}
});
</script></body></html>
