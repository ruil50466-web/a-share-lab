<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>A股研究工作台</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121d2e;--line:#26354a;--muted:#9aabc2;--text:#eef4ff;--accent:#73b7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Noto Sans SC",sans-serif}
header{max-width:1100px;margin:auto;padding:16px 14px 10px}h1{font-size:23px;margin:0}p{color:var(--muted);font-size:13px;margin:5px 0 12px}
nav{display:flex;gap:8px;overflow-x:auto;padding:0 0 8px}
nav button{flex:0 0 auto;border:1px solid var(--line);border-radius:10px;background:#172438;color:var(--text);padding:10px 13px;font-weight:700;font-size:14px}
nav button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#07111f}
main{max-width:1100px;margin:auto;padding:0 10px 18px}
.framewrap{height:calc(100dvh - 146px);min-height:520px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}
.note{padding:0 14px 12px;font-size:12px;color:var(--muted)}
@media(max-width:480px){header{padding-top:12px}.framewrap{height:calc(100dvh - 158px);min-height:480px}h1{font-size:21px}}
</style>
</head>
<body>
<header>
<h1>📈 A股研究工作台</h1>
<p>一个入口切换全部研究模块。数据仍来自各模块原有接口，请核对行情日期与数据口径。</p>
<nav role="tablist" aria-label="研究模块">
<button role="tab" id="tab-scan" aria-selected="true" data-page="index.html">个股与市场扫描</button>
<button role="tab" id="tab-intraday" aria-selected="false" data-page="intraday.html">个股分时</button>
<button role="tab" id="tab-market" aria-selected="false" data-page="market.html">收盘复盘</button>
</nav>
</header>
<main>
<div class="framewrap"><iframe id="module" src="index.html" title="A股研究模块"></iframe></div>
</main>
<div class="note">研究用途，不自动下单。公开行情可能延迟、限流或字段不完整；板块涨幅榜不等于主线确认。</div>
<script>
const frame=document.getElementById("module");
const tabs=[...document.querySelectorAll("nav button")];
tabs.forEach(tab=>tab.addEventListener("click",()=>{
  tabs.forEach(t=>t.setAttribute("aria-selected",String(t===tab)));
  const page=tab.dataset.page;
  if(frame.getAttribute("src")!==page) frame.setAttribute("src",page);
}));
</script>
</body>
</html>
