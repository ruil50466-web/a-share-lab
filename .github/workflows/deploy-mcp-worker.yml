name: Deploy A-Share Lab MCP Worker

on:
  push:
    branches:
      - main
    paths:
      - "services/market-data-mcp-worker.js"
      - "wrangler-mcp.toml"
      - ".github/workflows/deploy-mcp-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Deploy MCP Worker to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler-mcp.toml
